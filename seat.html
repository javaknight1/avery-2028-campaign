<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <meta name="robots" content="noindex,follow" />
  <meta property="og:type" content="website" />

  <meta property="og:title" content="Cabinet Seat — The Job & The Shortlist | Avery 2028" />
  <meta property="og:description" content="The full job description for a cabinet seat, the policies it owns, and a shortlist of who could fill it." />
  <meta property="og:image" content="https://avery-2028-campaign.pages.dev/assets/og.png" />
  <style>
    .seat-back { display: inline-block; font-family: "Oswald"; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.78rem; color: #cddbf0; margin-bottom: 16px; }
    .seat-head { display: flex; align-items: center; gap: 18px; }
    .seat-emoji { width: 76px; height: 76px; flex: none; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.25); display: grid; place-items: center; font-size: 2.1rem; overflow: hidden; }
    .seat-emoji img { width: 100%; height: 100%; object-fit: cover; }
    .seat-mission { margin-top: 18px; font-size: 1.18rem; color: #dbe6f6; max-width: 720px; }
    .seat-h2 { font-size: clamp(1.5rem, 3.4vw, 2rem); margin-bottom: 14px; }
    .seat-leads { display: flex; flex-wrap: wrap; gap: 8px; }
    .seat-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; color: var(--navy); font-weight: 600; font-size: 0.9rem; }
    .seat-pill:hover { border-color: var(--navy); }
    .seat-jd { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 30px; }
    .seat-jd h3 { font-size: 1.12rem; margin-bottom: 10px; }
    .seat-list { list-style: none; display: grid; gap: 9px; }
    .seat-list li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; color: var(--ink); }
    .seat-list li::before { content: "▸"; color: var(--red); font-weight: 700; }
    .seat-disc { font-size: 0.9rem; margin-bottom: 22px; }
    .muted { color: var(--muted); }
    .seat-cands { display: grid; gap: 16px; }
    .cand { display: grid; grid-template-columns: 84px 1fr; gap: 18px; align-items: start; background: var(--white); border: 1px solid var(--line); border-left: 4px solid var(--navy); border-radius: 12px; padding: 18px 22px; box-shadow: var(--shadow-sm); }
    .cand-av { width: 84px; height: 84px; border-radius: 50%; overflow: hidden; position: relative; background: var(--navy); display: grid; place-items: center; }
    .cand-av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cand-ph { color: #fff; font-family: "Oswald"; font-weight: 600; font-size: 1.5rem; }
    .cand h4 { font-size: 1.18rem; margin-bottom: 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
    .cand-wiki { font-size: 0.78rem; font-weight: 600; color: var(--blue); white-space: nowrap; }
    .cand-bg { color: var(--ink); margin-bottom: 8px; }
    .cand-why { color: var(--muted); }
    .cand-why b { color: var(--navy); }
    .seat-reqs { margin-top: 30px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; }
    .seat-reqs h3 { font-size: 1.12rem; margin-bottom: 10px; }
    .seat-reqlist { list-style: none; display: grid; gap: 8px; }
    .seat-reqlist li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; color: var(--ink); }
    .seat-reqlist li::before { content: "✓"; color: #1f7a4d; font-weight: 700; }
    @media (max-width: 520px) { .cand { grid-template-columns: 1fr; } .cand-av { width: 72px; height: 72px; } }
    .seat-self, .seat-tbd { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
    .seat-self { display: flex; gap: 18px; align-items: center; }
    .seat-self .seat-self-av { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; flex: none; border: 2px solid var(--white); box-shadow: var(--shadow-sm); }
    .seat-self .seat-self-av img { width: 100%; height: 100%; object-fit: cover; }
    .seat-tbd b { font-family: "Oswald"; color: var(--navy); font-size: 1.1rem; }
    @media (max-width: 640px) { .seat-jd { grid-template-columns: 1fr; gap: 22px; } }
  </style>
</head>

  <script src="scripts/seat.js" defer></script>
