<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Avery for President 2028</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root{ --navy:#0b2545; --navy-deep:#061629; --red:#c8102e; --gold:#f4b740; }
    *{ margin:0; box-sizing:border-box; }
    body{ min-height:100svh; display:grid; place-items:center; text-align:center; padding:24px;
      background:var(--navy-deep); color:#fff; font-family:"Source Sans 3",system-ui,sans-serif; overflow:hidden; }
    .glow{ position:fixed; inset:0; z-index:0; opacity:.5;
      background:radial-gradient(800px 400px at 80% -10%,rgba(42,109,244,.35),transparent 60%),
                 radial-gradient(700px 400px at 10% 110%,rgba(200,16,46,.3),transparent 60%); }
    .wrap{ position:relative; z-index:1; }
    h1{ font-family:"Oswald"; font-weight:700; font-size:clamp(5rem,22vw,11rem); line-height:1;
      color:var(--gold); letter-spacing:2px; animation:pop .6s cubic-bezier(.22,1,.36,1); }
    p{ color:#c3d2e8; font-size:1.15rem; margin:6px 0 28px; }
    a{ display:inline-block; padding:14px 28px; border-radius:8px; font-family:"Oswald"; text-transform:uppercase;
      letter-spacing:1px; color:#fff; background:var(--red); text-decoration:none;
      box-shadow:0 10px 28px rgba(200,16,46,.35); transition:transform .2s ease; }
    a:hover{ transform:translateY(-3px); }
    @keyframes pop{ from{ opacity:0; transform:scale(.85);} }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <h1>404</h1>
    <p>This page took a detour. The future's back this way.</p>
    <a href="/">← Return to the campaign</a>
  </div>
</body>
</html>
