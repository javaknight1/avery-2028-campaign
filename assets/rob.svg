<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-label="Stylized portrait placeholder of Rob Avery">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14365f"/>
      <stop offset="100%" stop-color="#061629"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16335c"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </linearGradient>
  </defs>
  <rect width="640" height="800" fill="url(#bg)"/>
  <!-- faint stars -->
  <g fill="#ffffff" opacity="0.10">
    <circle cx="80" cy="90" r="3"/><circle cx="180" cy="60" r="2"/><circle cx="540" cy="120" r="3"/>
    <circle cx="600" cy="240" r="2"/><circle cx="60" cy="320" r="2"/><circle cx="500" cy="60" r="2"/>
  </g>
  <!-- subtle stripe band -->
  <g opacity="0.08">
    <rect x="0" y="520" width="640" height="26" fill="#c8102e"/>
    <rect x="0" y="572" width="640" height="26" fill="#ffffff"/>
    <rect x="0" y="624" width="640" height="26" fill="#c8102e"/>
  </g>
  <!-- shoulders / suit -->
  <path d="M120 800 C140 640 230 600 320 600 C410 600 500 640 520 800 Z" fill="url(#suit)"/>
  <path d="M300 800 L320 660 L340 800 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M312 668 L320 690 L328 668 L320 660 Z" fill="#c8102e"/>
  <!-- neck -->
  <rect x="296" y="540" width="48" height="80" rx="20" fill="#e8b98f"/>
  <!-- head -->
  <circle cx="320" cy="430" r="120" fill="#f0c6a0"/>
  <!-- hair -->
  <path d="M205 420 C205 330 270 300 320 300 C370 300 435 330 435 420 C435 360 390 345 320 348 C250 351 215 372 205 420 Z" fill="#3a2e26"/>
  <path d="M205 425 C205 470 215 490 222 500 C210 450 220 405 240 388 C220 398 208 410 205 425 Z" fill="#3a2e26"/>
  <!-- simple features -->
  <g fill="#5b4636">
    <circle cx="285" cy="425" r="7"/><circle cx="355" cy="425" r="7"/>
  </g>
  <path d="M300 470 Q320 482 340 470" stroke="#b07b54" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- lapel pin (gold star) -->
  <path d="M250 700 l6 12 13 2 -9 9 2 13 -12 -6 -12 6 2 -13 -9 -9 13 -2 z" fill="#f4b740"/>
</svg>
